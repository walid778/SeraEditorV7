  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <script>
    function _prepareOcrImage(imagePath) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(2, 2200 / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          const context = canvas.getContext("2d", { willReadFrequently: true });
          context.drawImage(image, 0, 0, canvas.width, canvas.height);

          const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < pixels.data.length; i += 4) {
            const gray = pixels.data[i] * 0.299 +
              pixels.data[i + 1] * 0.587 +
              pixels.data[i + 2] * 0.114;
            const contrast = Math.max(0, Math.min(255, (gray - 128) * 1.35 + 128));
            pixels.data[i] = contrast;
            pixels.data[i + 1] = contrast;
            pixels.data[i + 2] = contrast;
            pixels.data[i + 3] = 255;
          }
          context.putImageData(pixels, 0, 0);
          resolve({ canvas, image: canvas.toDataURL("image/png") });
        };
        image.onerror = () => reject(new Error("تعذر تجهيز الصورة لقراءة النص"));
        image.src = imagePath;
      });
    }

    async function _extractText(imagePath, mapData) {
      const worker = await Tesseract.createWorker();
      try {
        await worker.load();
        await worker.loadLanguage(mapData.language);
        await worker.initialize(mapData.language);
        const parameters = { ...mapData.args };
        const cardMode = Boolean(parameters.tessjs_card_mode);
        delete parameters.tessjs_card_mode;
        await worker.setParameters(parameters);
        const prepared = await _prepareOcrImage(imagePath);
        const result = await worker.recognize(prepared.image);
        let text = result.data.text;

        if (cardMode) {
          const canvas = prepared.canvas;
          const details = document.createElement("canvas");
          details.width = Math.round(canvas.width * 0.66);
          details.height = Math.round(canvas.height * 0.40);
          details.getContext("2d").drawImage(
            canvas,
            Math.round(canvas.width * 0.32),
            Math.round(canvas.height * 0.28),
            details.width,
            details.height,
            0,
            0,
            details.width,
            details.height,
          );
          await worker.setParameters({ ...parameters, psm: "6" });
          const detailsResult = await worker.recognize(
            details.toDataURL("image/png"),
          );
          text += "\n" + detailsResult.data.text;

          const numberBand = document.createElement("canvas");
          numberBand.width = Math.round(canvas.width * 0.92);
          numberBand.height = Math.round(canvas.height * 0.30);
          numberBand.getContext("2d").drawImage(
            canvas,
            Math.round(canvas.width * 0.04),
            Math.round(canvas.height * 0.62),
            numberBand.width,
            numberBand.height,
            0,
            0,
            numberBand.width,
            numberBand.height,
          );
          await worker.setParameters({
            psm: "6",
            tessedit_char_whitelist: "0123456789٠١٢٣٤٥٦٧٨٩",
          });
          const numberResult = await worker.recognize(
            numberBand.toDataURL("image/png"),
          );
          text += "\n" + numberResult.data.text;

          const strip = document.createElement("canvas");
          strip.width = Math.round(canvas.width * 0.52);
          strip.height = Math.round(canvas.height * 0.18);
          strip.getContext("2d").drawImage(
            canvas,
            Math.round(canvas.width * 0.40),
            Math.round(canvas.height * 0.68),
            strip.width,
            strip.height,
            0,
            0,
            strip.width,
            strip.height,
          );
          const enlargedStrip = document.createElement("canvas");
          enlargedStrip.width = strip.width * 3;
          enlargedStrip.height = strip.height * 3;
          const enlargedContext = enlargedStrip.getContext("2d", {
            willReadFrequently: true,
          });
          enlargedContext.drawImage(
            strip,
            0,
            0,
            enlargedStrip.width,
            enlargedStrip.height,
          );
          const enlargedPixels = enlargedContext.getImageData(
            0,
            0,
            enlargedStrip.width,
            enlargedStrip.height,
          );
          for (let i = 0; i < enlargedPixels.data.length; i += 4) {
            const value =
              enlargedPixels.data[i] * 0.299 +
              enlargedPixels.data[i + 1] * 0.587 +
              enlargedPixels.data[i + 2] * 0.114;
            const binary = value > 165 ? 255 : 0;
            enlargedPixels.data[i] = binary;
            enlargedPixels.data[i + 1] = binary;
            enlargedPixels.data[i + 2] = binary;
          }
          enlargedContext.putImageData(enlargedPixels, 0, 0);
          await worker.setParameters({
            psm: "7",
            tessedit_char_whitelist: "0123456789٠١٢٣٤٥٦٧٨٩",
          });
          const lineResult = await worker.recognize(
            enlargedStrip.toDataURL("image/png"),
          );
          text += "\n" + lineResult.data.text;
        }

        return mapData.args["tessjs_create_hocr"]
          ? result.data.hocr
          : text;
      } finally {
        await worker.terminate();
      }
    }
  </script>
