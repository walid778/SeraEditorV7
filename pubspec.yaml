name: seraeditor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  archive: ^3.6.1
  file_picker: ^9.2.3
  intl: ^0.19.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  logging: ^1.1.1
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.9.0
  
  image: ^4.2.0
  image_picker: ^1.1.2
  flutter_tesseract_ocr: ^0.4.31
  google_mlkit_text_recognition: ^0.13.0

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  sqflite_common_ffi_web: ^0.4.5+4
  path_provider: ^2.1.5
  dio: ^5.11.1

flutter_native_splash:
  color: "#ffffff"            # لون الخلفية
  image: assets/icons/splash_logo.png    # الصورة اللي هتظهر
  android: true
  ios: true

  android_12:
    color: "#ffffff"
    image: assets/icons/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appIcon.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/templates/
    - assets/icons/
    - assets/tessdata_config.json
    - assets/tessdata/